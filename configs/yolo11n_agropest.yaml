# YOLO11n Detection Config — AgroPest-12
path: data/AgroPest12
train: images/train
val: images/val
test: images/test

nc: 12
names:
  0: aphid
  1: armyworm
  2: beetle
  3: bollworm
  4: grasshopper
  5: mite
  6: mosquito
  7: sawfly
  8: stem_borer
  9: thrips
  10: weevil
  11: whitefly

# Training settings (passed to ultralytics YOLO trainer)
epochs: 85
patience: 30           # EarlyStopping
imgsz: 640
batch: 16
optimizer: SGD
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
mosaic: 1.0
scale: 0.5
