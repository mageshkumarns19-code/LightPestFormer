# LightPestFormer Classification Config
model:
  backbone: efficientnet_b2
  pretrained: true
  out_indices: [2, 3, 4]           # C2(48ch), C3(120ch), C4(352ch)
  mssa_dim: 256
  dropout: 0.30
  num_classes: 204

data:
  root: data/INSECT204
  img_size: 224
  batch_size: 32
  num_workers: 4
  train_aug:
    - RandomHorizontalFlip: {p: 0.5}
    - RandomVerticalFlip: {p: 0.2}
    - ColorJitter: {brightness: 0.3, contrast: 0.3, saturation: 0.2}
    - RandomRotation: {degrees: 15}
    - RandomResizedCrop: {size: 224, scale: [0.7, 1.0]}
    - Normalize: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}

loss:
  label_smoothing: 0.10
  contrastive_tau: 0.07
  alpha_start: 0.70
  alpha_end: 0.85

training:
  phase1:
    epochs: 5
    freeze_backbone: true
    optimizer: Adam
    lr: 1.0e-3
    alpha: 0.70

  phase2:
    epochs: 40
    freeze_backbone: false
    optimizer: Adam
    backbone_lr: 1.0e-4
    head_lr: 5.0e-4
    scheduler: cosine
    early_stop_patience: 10

output:
  weights_dir: weights/
  checkpoint_name: lightpestformer_best.pth
  log_dir: runs/classification/
